# Fixes log data. Newest-first: file order is the display order.
#
# To add a new fix, prepend a new entry at the top of this list.
# Fields:
#   package:       short package name
#   upstream_name: e.g. "atomontage/xterm-color"
#   upstream_url:  full https URL to the upstream repo
#   warning:       short warning text (plain text; may mention code names)
#   fix:           short paragraph describing the fix
#   ci:            what CI was added, or "None; <reason>"
#   pr_url:        full PR URL
#   pr_label:      e.g. "atomontage/xterm-color#51"
#   status:        one of Submitted, Merged, Closed, In progress
#   note:          optional extra (omit if not needed)

- package: winum
  upstream_name: deb0ch/emacs-winum
  upstream_url: https://github.com/deb0ch/emacs-winum
  warning: "Docstrings with unescaped single quotes (4)."
  fix: >-
    Escaped the docstring quotes. The missing lexical-binding cookie, a
    defcustom `:type 'list`, and the deprecated `define-minor-mode` positional
    args are left as residual (all behaviour-changing).
  ci: "Repo had no CI. Added byte-compile + load on Emacs 24.5, 30.1, snapshot (no -Werror, residual warnings remain) + dependabot."
  pr_url: https://github.com/deb0ch/emacs-winum/pull/37
  pr_label: deb0ch/emacs-winum#37
  status: Submitted

- package: deferred
  upstream_name: kiwanami/emacs-deferred
  upstream_url: https://github.com/kiwanami/emacs-deferred
  warning: "Quoted condition-case conditions, and docstring quoting/width."
  fix: >-
    Unquoted the condition-case conditions and fixed docstring quoting and
    width across deferred.el and concurrent.el. Residual: `cl-gensym` (the
    `gensym` replacement needs Emacs 26.1, above the 24.x minimum) and an
    unused-length debug path.
  ci: "Repo had no CI. Added byte-compile + load on Emacs 24.4, 30.1, snapshot (no -Werror, residual warnings remain) + dependabot."
  pr_url: https://github.com/kiwanami/emacs-deferred/pull/60
  pr_label: kiwanami/emacs-deferred#60
  status: Submitted

- package: sage-shell-mode
  upstream_name: sagemath/sage-shell-mode
  upstream_url: https://github.com/sagemath/sage-shell-mode
  warning: "Seven warning types: obsolete point-at-bol, obsolete font-lock face variables, docstring quoting and width, doc string after interactive, quoted cl-case keys, and a missing lexical-binding cookie."
  fix: >-
    Fixed all seven behaviour-preserving warning types, one commit each:
    point-at-bol to line-beginning-position, quoted font-lock faces, escaped and
    reflowed docstrings, moved a docstring before interactive, bare cl-case keys,
    and added a lexical-binding cookie to a file that does not rely on dynamic
    binding. Warning count dropped from 30 to 8; the residual 8 are
    behaviour-changing (defcustom :type widgets, alias ordering, struct types).
  ci: "No GitHub Actions existed (only legacy .travis.yml). Added byte-compile + load on Emacs 24.4, 30.1, snapshot (no -Werror, residual warnings remain) + dependabot."
  pr_url: https://github.com/sagemath/sage-shell-mode/pull/87
  pr_label: sagemath/sage-shell-mode#87
  status: Submitted

- package: caml
  upstream_name: ocaml/caml-mode
  upstream_url: https://github.com/ocaml/caml-mode
  warning: "Five defface forms fail to specify a containing customization group."
  fix: >-
    Added `:group 'languages` to each defface across camldebug.el, caml-font.el,
    and caml-font-old.el. Behaviour-preserving (faces and defaults unchanged).
  ci: "Repo had no CI. Added byte-compile (warnings as errors) on Emacs 24.4, 30.1, snapshot + dependabot. No residual warnings."
  pr_url: https://github.com/ocaml/caml-mode/pull/21
  pr_label: ocaml/caml-mode#21
  status: Submitted

- package: rust-mode
  upstream_name: rust-lang/rust-mode
  upstream_url: https://github.com/rust-lang/rust-mode
  warning: "`when-let` obsolete (3 uses), and an inaccurate declared minimum Emacs."
  fix: >-
    Rewrote three `when-let` uses with `let` + `when`. Corrected Package-Requires
    from 25.1 to 26.1 (uses `file-local-name`, Emacs 26.1) and added a runtime
    `(require 'subr-x)` for `string-trim`. No residual warnings.
  ci: "Added a byte-compile job (warnings as errors) on Emacs 26.1, 30.1, snapshot; tree-sitter file compiled only on Emacs >= 29.1 per its guard."
  pr_url: https://github.com/rust-lang/rust-mode/pull/589
  pr_label: rust-lang/rust-mode#589
  status: Submitted

- package: imenu-list
  upstream_name: bmag/imenu-list
  upstream_url: https://github.com/bmag/imenu-list
  warning: "Docstring unescaped single quotes, and obsolete `point-at-bol`."
  fix: >-
    Escaped the docstring quotes and replaced `point-at-bol` with
    `line-beginning-position`. The missing lexical-binding cookie and the
    obsolete `hs-special-modes-alist` are left as residual (behaviour-changing).
  ci: "Repo had no CI. Added byte-compile + load on Emacs 24.3, 30.1, snapshot (no -Werror, residual warnings remain) + dependabot."
  pr_url: https://github.com/bmag/imenu-list/pull/90
  pr_label: bmag/imenu-list#90
  status: Submitted

- package: evil-commentary
  upstream_name: linktohack/evil-commentary
  upstream_url: https://github.com/linktohack/evil-commentary
  warning: "Org integration functions not known to be defined at compile time."
  fix: >-
    Added `declare-function` for `org-at-heading-p` and `org-toggle-comment`,
    matching the existing `org-in-src-block-p` declaration. The two missing
    `lexical-binding` cookies are left as residual: adding them would change
    behaviour (`evil-define-key` and a single-arg `eval` macro rely on dynamic
    binding).
  ci: "Repo had no CI. Added GitHub Actions (Emacs 27.1, 30.1, snapshot; install evil, byte-compile, load) without -Werror since behaviour-changing warnings remain, plus dependabot."
  pr_url: https://github.com/linktohack/evil-commentary/pull/31
  pr_label: linktohack/evil-commentary#31
  status: Submitted

- package: evil-surround
  upstream_name: emacs-evil/evil-surround
  upstream_url: https://github.com/emacs-evil/evil-surround
  warning: "Unused lexical argument `type` (x4) in test/evil-surround-test.el."
  fix: >-
    Prefixed the shadowed, never-read `type` argument with an underscore
    (`_type`) in the four `evil-define-text-object` forms; the bodies still
    reference the macro's own `type` binding, so behaviour is unchanged.
  ci: "Repo had no CI. Added GitHub Actions (Emacs 27.2, 30.1, snapshot; install evil, byte-compile the library with warnings as errors, load) plus dependabot."
  pr_url: https://github.com/emacs-evil/evil-surround/pull/220
  pr_label: emacs-evil/evil-surround#220
  status: Submitted

- package: autothemer
  upstream_name: jasonm23/autothemer
  upstream_url: https://github.com/jasonm23/autothemer
  warning: "Docstrings with unescaped single quotes (two functions)."
  fix: >-
    Escaped the opening quote of quoted-list examples in two docstrings.
    Docstring-only and behaviour-preserving.
  ci: "Existing CI ran only ert tests; added Emacs 30.1 to the matrix, bumped checkout to v5, and added dependabot. A warnings-as-errors job was not added because the package has many pre-existing out-of-scope warnings."
  pr_url: https://github.com/jasonm23/autothemer/pull/31
  pr_label: jasonm23/autothemer#31
  status: Merged

- package: treepy
  upstream_name: volrath/treepy.el
  upstream_url: https://github.com/volrath/treepy.el
  warning: "Assignment/reference to free variables in tests, plus a docstring with unescaped single quotes."
  fix: >-
    Declared the top-level test fixtures `numered-tree` and `custom-zipper`
    with `defvar` instead of `setq`, and de-quoted a docstring. Also
    corrected Package-Requires from 25.1 to 27.1, since treepy.el uses
    `with-suppressed-warnings` (Emacs 27.1).
  ci: "GitHub Actions across Emacs 27.1, 30.1, and snapshot; byte-compile (warnings as errors) and run tests; dependabot for actions."
  pr_url: https://github.com/volrath/treepy.el/pull/19
  pr_label: volrath/treepy.el#19
  status: Submitted

- package: yaml
  upstream_name: zkry/yaml.el
  upstream_url: https://github.com/zkry/yaml.el
  warning: "Two `Unused lexical variable` warnings in yaml-tests.el."
  fix: >-
    Dropped the unused `condition-case` error variable (use nil) and renamed
    an unused `let*` binding to `_parsed`.
  ci: "Existing CI ran only Emacs 27.2; added a byte-compile job (warnings as errors) across Emacs 25.1, 30.1, and snapshot, plus dependabot."
  pr_url: https://github.com/zkry/yaml.el/pull/66
  pr_label: zkry/yaml.el#66
  status: Submitted

- package: merlin
  upstream_name: ocaml/merlin
  upstream_url: https://github.com/ocaml/merlin
  warning: "`when-let` obsolete as of Emacs 31.1 (use `when-let*` or `and-let*`)."
  fix: >-
    Rewrote the call site in `merlin--construct-point` with `let` + `when`.
    Backward compatible; avoided `when-let*` (Emacs 26.1) to keep the package's
    declared 25.1 minimum.
  ci: None; merlin already has an Emacs lint CI workflow.
  pr_url: https://github.com/ocaml/merlin/pull/2076
  pr_label: ocaml/merlin#2076
  status: Submitted

- package: xterm-color
  upstream_name: atomontage/xterm-color
  upstream_url: https://github.com/atomontage/xterm-color
  warning: "`if-let` obsolete as of Emacs 31.1 (use `if-let*`)."
  fix: >-
    Rewrote the 4 call sites with plain `let` + `if`. This is backward
    compatible and does not bump the minimum version for the fix itself. Also
    corrected Package-Requires from 24.4 to 25.1, since the package uses
    `defvar-local` (introduced in Emacs 25.1).
  ci: >-
    GitHub Actions across Emacs 25.1, 30.1, and snapshot. Byte-compile
    (warnings as errors) and load. Dependabot for actions.
  pr_url: https://github.com/atomontage/xterm-color/pull/51
  pr_label: atomontage/xterm-color#51
  status: Submitted
  note: upstream appears dormant
