# Fixes log data. Newest-first: file order is the display order.
#
# To add a new fix, prepend a new entry at the top of this list.
# Fields:
#   package:       short package name
#   upstream_name: e.g. "atomontage/xterm-color"
#   upstream_url:  full https URL to the upstream repo
#   warning:       short warning text (plain text; may mention code names)
#   fix:           short paragraph describing the fix
#   ci:            what CI was added, or "None; <reason>"
#   pr_url:        full PR URL
#   pr_label:      e.g. "atomontage/xterm-color#51"
#   status:        one of Submitted, Merged, Closed, In progress
#   note:          optional extra (omit if not needed)

- package: consult-gh
  upstream_name: armindarvish/consult-gh
  upstream_url: https://github.com/armindarvish/consult-gh
  warning: "Obsolete when-let/if-let (Emacs 31.1), a sort arity false positive on Emacs < 30, and two stranded checks discarded in non-tail positions."
  fix: >-
    Replaced 90 when-let/if-let call sites with when-let*/if-let* (available
    since Emacs 26.1, below the 29.4 minimum; single-binding sugar wrapped into
    binding lists). Fixed two latent bugs the warnings exposed: a goto-char
    trapped as a when-let binding in 10 copied commit-setup blocks (so point was
    never moved), and a non-empty ref-link test left in a non-tail body position
    in the embark create commands. Wrapped the Emacs 30+ keyword sort in
    with-suppressed-warnings ((callargs sort)) so Emacs < 30 does not arity-check
    the dead branch. No minimum bump; behaviour-preserving except the two
    clearly-intended bug fixes.
  ci: "Repo had no CI. Added a byte-compile job (warnings as errors) on Emacs 29.4, 30.1, and snapshot; installs deps from GNU/NonGNU/MELPA."
  pr_url: https://github.com/armindarvish/consult-gh/pull/268
  pr_label: armindarvish/consult-gh#268
  status: Submitted
  note: "consult-gh-with-pr-review.el excluded from the sweep: a pre-existing pr-review-open arity mismatch (3 args vs 4-7) against current pr-review, left for the maintainer rather than masked."

- package: smartparens
  upstream_name: Fuco1/smartparens
  upstream_url: https://github.com/Fuco1/smartparens
  warning: "Obsolete lsh/if-let/when-let/point-at-eol, docstring quoting/width, unused vars, and undefined-function/free-variable references."
  fix: >-
    Seven types: lsh -> ash, if-let/when-let -> let + if/when, point-at-eol ->
    line-end-position, escaped/reflowed docstrings, dropped/underscored unused
    vars, and forward defvar / declare-function for free vars and optional
    functions. A later remediation pass cleared the last three classes:
    --reduce -> --min-by (verified tie-equivalent), 3-arg cycle-spacing ->
    just-one-space (identical on 29.1+), and with-suppressed-warnings around the
    intentionally-retained legacy defadvice sites. No minimum bump (all
    compatible with 27.1+); warning-clean under -Werror.
  ci: "Added a byte-compile job (warnings as errors) on the full matrix Emacs 27.1-30.1 and snapshot; installs dash."
  pr_url: https://github.com/Fuco1/smartparens/pull/1242
  pr_label: Fuco1/smartparens#1242
  status: Submitted

- package: rustic
  upstream_name: emacs-rustic/rustic
  upstream_url: https://github.com/emacs-rustic/rustic
  warning: "Obsolete cl-gensym/if-let/when-let, docstring quoting/width, and unused lexical args."
  fix: >-
    Five types: cl-gensym -> gensym, if-let/when-let -> if-let*/when-let* (all
    fine on the declared 28.2 minimum), escaped/reflowed docstrings, underscored
    unused args. Residual: optional-integration free vars/functions (eglot,
    flycheck, polymode, lsp, inheritenv) and behaviour-changing replacements
    (replace-buffer-contents, project-roots, a defcustom :type).
  ci: "Repo had no byte-compile CI. Added byte-compile + load on Emacs 28.2, 30.1, snapshot + dependabot."
  pr_url: https://github.com/emacs-rustic/rustic/pull/128
  pr_label: emacs-rustic/rustic#128
  status: Submitted
  note: "earlier PR to the dormant brotzeit/rustic was closed in favour of this"

