    documenting the single-arg `eval` macro's dynamic-binding requirement.
  ci: "Repo had no CI. Added GitHub Actions (install evil, byte-compile, load) on Emacs 27.1, 30.1, snapshot + dependabot; warnings as errors on 30.1 + snapshot, 27.1 kept plain."
  pr_url: https://github.com/linktohack/evil-commentary/pull/31
