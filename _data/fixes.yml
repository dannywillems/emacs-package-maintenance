- package: general
  upstream_name: noctuid/general.el
  upstream_url: https://github.com/noctuid/general.el
  warning: "Docstring quoting/width, more than one docstring, and functions not known to be defined."
  fix: >-
    Escaped docstring quotes (incl. macro-generated ones), reflowed a wide
    docstring, moved a misplaced `declare`, and added `declare-function`s. A
    remediation pass cleared the last two classes: the invalid `or` widget type
    became `(choice symbol (repeat symbol))` (a latent bug, `or` is not a widget
    type), and the two `cl-gensym` uses now go through a version-aware
    `general--gensym` alias (built-in `gensym` when available, else `cl-gensym`
    via with-suppressed-warnings), preserving the 24.4 minimum.
  ci: "Repo had no byte-compile CI. Added byte-compile (warnings as errors) on the full matrix Emacs 28.2, 29.4, 30.1, snapshot + dependabot. Warning-clean."
  pr_url: https://github.com/noctuid/general.el/pull/571
  pr_label: noctuid/general.el#571
  status: Submitted

