# Per-package coverage recap. Complementary to MELPA: a maintenance-health
# snapshot (was a fix sent, was CI added, what does CI actually test, when was
# it last checked) to gauge how well a package's continued support is verified.
# Not a package source and not a replacement for MELPA.
#
# Fields:
#   package, upstream, url
#   outcome:  PR | Skipped
#   status:   Submitted | Merged | Skipped
#   pr_url, pr_label  (when outcome is PR)
#   ci:       Added | Extended | Existing | None
#   tested:   short summary of what CI exercises (Emacs versions etc.)
#   werror:   Yes | No | Unknown   (byte-compile with warnings as errors)
#   checked:  YYYY-MM-DD of the last check
#   note:     optional short note (e.g. skip reason)

